<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2076년에서 온 친구</title>
<style>
:root{
  --bg:#12161A; --panel:#1B2127; --panel2:#232B33;
  --ink:#E8EEF2; --mid:#9DAAB3; --soft:#6E7C86;
  --amber:#E9A33C; --amber-bg:#3A2C17; --amber-line:#4A3A1E;
  --me:#2C3944; --me-ink:#DCE7EE; --line:#2B343C;
  --f:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
  font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%;}
.app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px;}

header{padding:24px 4px 14px;border-bottom:1px solid var(--line);}
.win{display:flex;align-items:center;gap:12px;}
.pane{width:54px;height:40px;flex:none;border:2px solid #3B454E;border-radius:3px;
  background:linear-gradient(170deg,#6A5638 0%,#4A3E2C 55%,#33302B 100%);position:relative;overflow:hidden;}
.pane::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(96deg,rgba(233,163,60,.16) 0 3px,transparent 3px 8px);}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.02em;}
.tag{font-size:13.5px;color:var(--mid);margin:2px 0 0;}
.intro{font-size:14.5px;color:var(--mid);margin:12px 0 0;}

.log{flex:1;padding:18px 2px 6px;display:flex;flex-direction:column;gap:15px;}
.msg{display:flex;gap:11px;align-items:flex-start;}
.who{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;}
.bot .who{background:var(--amber-bg);color:var(--amber);border:1.5px solid var(--amber-line);}
.me{flex-direction:row-reverse;}
.me .who{background:var(--me);color:var(--me-ink);border:1.5px solid #37454F;}
.bubble{padding:13px 17px;border-radius:16px;font-size:16.5px;line-height:1.8;
  white-space:pre-wrap;word-break:break-word;max-width:100%;}
.bot .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:5px;}
.me .bubble{background:var(--me);color:var(--me-ink);border-top-right-radius:5px;}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px 0;}
.chip{font-family:var(--f);font-size:14.5px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:9px 15px;cursor:pointer;}
.chip:hover{background:var(--panel2);border-color:#3D4952;}
.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

.bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 16px;
  border-top:1px solid var(--line);margin-top:14px;}
.row{display:flex;gap:9px;align-items:flex-end;}
textarea{flex:1;font-family:var(--f);font-size:16.5px;line-height:1.6;color:var(--ink);
  background:var(--panel);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 15px;resize:none;height:50px;max-height:130px;}
textarea:focus{outline:none;border-color:#4C5A64;}
textarea::placeholder{color:var(--soft);}
.send{font-family:var(--f);font-size:16px;font-weight:700;color:#22160A;background:var(--amber);
  border:none;border-radius:14px;padding:0 22px;height:50px;cursor:pointer;flex:none;}
.send:disabled{opacity:.4;cursor:default;}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.mini{font-family:var(--f);font-size:13px;color:var(--mid);background:none;
  border:1px solid var(--line);border-radius:16px;padding:5px 13px;cursor:pointer;}
.mini:hover{color:var(--ink);border-color:#3D4952;}
.truth{font-size:12.5px;color:var(--soft);line-height:1.5;text-align:right;flex:1;min-width:200px;}

@media (max-width:520px){
  body{font-size:16px;}
  .truth{text-align:left;}
}
@media print{
  body{background:#fff;color:#000;font-size:12pt;}
  .app{max-width:none;padding:0;}
  header{border-color:#999;}
  .pane,.chips,.bar,.intro{display:none!important;}
  h1{font-size:18pt;}
  .tag{color:#444;}
  .bubble{background:#fff!important;border:1px solid #999!important;color:#000!important;}
  .who{background:#eee!important;color:#000!important;border:1px solid #999!important;}
  .log{gap:10px;}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="win">
      <div class="pane"></div>
      <div>
        <h1>2076년에서 온 친구</h1>
        <p class="tag">하온 · 열두 살 · 오늘도 바깥은 51도</p>
      </div>
    </div>
    <p class="intro">궁금한 걸 물어보세요. 하온이가 2076년의 하루를 이야기해 줄 거예요.</p>
  </header>

  <div class="log" id="log"></div>
  <div class="chips" id="chips"></div>

  <div class="bar">
    <div class="row">
      <textarea id="input" placeholder="물어보고 싶은 걸 써 보세요" maxlength="200"></textarea>
      <button class="send" id="send" type="button">보내기</button>
    </div>
    <div class="tools">
      <button class="mini" id="reset" type="button">처음부터</button>
      <button class="mini" id="print" type="button">대화 인쇄하기</button>
      <p class="truth">하온이는 진짜 미래에서 온 사람이 아니에요.<br>지금 우리가 만든 <b>상상</b>이에요.</p>
    </div>
  </div>
</div>

<script>
/* ── 하온이의 대답 주머니 ─────────────────────────────── */
var BANK = [
{k:["안녕","반가","하이","누구","이름","몇살","몇 살","소개"],
 r:["안녕! 나는 하온이야. 2076년에 살고 있어. 너희랑 똑같이 열두 살이야.\n오늘도 바깥 온도가 51도라서 학교 밖으로는 못 나갔어.\n너는 오늘 밖에 나가 봤어?",
    "반가워. 나는 하온이라고 해.\n여기 2076년에서는 아침마다 오늘 밖에 나갈 수 있는 날인지 방송으로 알려 줘.\n오늘은 못 나가는 날이었어.\n너희는 아침에 뭘 제일 먼저 확인해?",
    "안녕! 만나서 좋다.\n네 목소리가 아주 먼 데서 오는 것 같아. 사실 정말 멀긴 하지.\n50년이나 떨어져 있으니까.\n너는 50년 뒤에 뭘 하고 있을 것 같아?"]},

{k:["더워","덥","온도","몇도","몇 도","여름","기온","날씨","뜨거"],
 r:["오늘 낮에 51도였어. 어제는 49도.\n50도가 넘으면 아예 밖에 나가지 말라는 신호가 울려.\n우리는 그냥 그런가 보다 해.\n너희 교실은 지금 몇 도야?",
    "여름은 5월에 시작해서 10월까지 이어져.\n제일 더운 두 달은 학교를 아예 안 가.\n대신 겨울에 학교를 더 다녀.\n너희는 여름방학이 언제야?",
    "더운 건 사실 잘 몰라. 밖에 오래 있어 본 적이 없거든.\n에어컨이 꺼지면 그때 알아. 십 분만 지나도 숨이 답답해져.\n너는 더울 때 어떻게 해?"]},

{k:["밖","바깥","나가","외출","산책","놀이터","공원","운동장"],
 r:["밖에는 해 지고 나서만 나가. 그것도 잠깐.\n낮에 나가려면 얼굴을 다 덮는 마스크를 써야 해.\n일주일에 한 번쯤 나갈 수 있으면 좋은 주야.\n너는 밖에 나가면 제일 먼저 뭘 해?",
    "우리 학교 운동장은 이십 년 전에 없어졌대.\n지금은 그 자리에 실내 체육관이 서 있어.\n창문은 없고, 벽에 큰 화면이 있어서 하늘 영상을 틀어 줘.\n진짜 하늘은 어떤 색이야?",
    "창문은 다 철판으로 막혀 있어.\n작은 유리창이 하나 있는데 거기로 밖을 봐.\n잿빛 모래바람이 부는 날이 제일 많아.\n너희 창밖에는 뭐가 보여?"]},

{k:["학교","교실","수업","공부","급식","선생","등교","책상"],
 r:["우리 교실은 지하 2층에 있어. 창문이 없어서 낮인지 밤인지 몰라.\n대신 천장 불빛이 아침엔 하얗고 저녁엔 노래져.\n그걸로 시간을 알아.\n너희 교실에는 창문이 있어?",
    "학교 갈 때는 지하 통로로 걸어가.\n집에서 학교까지 한 번도 밖으로 안 나와.\n비 오는 날도 우산이 필요 없어.\n너는 학교까지 어떻게 가?",
    "급식은 대부분 실내 농장에서 키운 거야.\n상추랑 콩 같은 건 많은데, 과일은 귀해.\n딸기는 일 년에 두어 번 먹어.\n너희는 급식에 뭐가 제일 자주 나와?"]},

{k:["놀","축구","운동","체육","게임","뛰","자전거","수영","친구랑"],
 r:["체육은 실내 체육관에서 해. 공을 차긴 하는데 좁아서 멀리는 못 차.\n선생님이 옛날엔 잔디 위에서 축구했다고 알려 주셨어.\n잔디를 밟는 건 어떤 느낌이야?",
    "우리는 주로 안에서 놀아. 화면으로 하는 놀이가 많아.\n밖에서 뛰어논 이야기는 할머니한테서만 들었어.\n너는 오늘 밖에서 놀았어?",
    "수영장은 있어. 물이 아주 귀해서 한 달에 한 번만 열어.\n그날은 다들 아침부터 신나 있어.\n너희는 물을 마음껏 쓸 수 있어?"]},

{k:["별","밤하늘","우주에 별","은하"],
 r:["별은 거의 안 보여. 공기 중에 먼지가 너무 많아서 밤에도 뿌예.\n사진으로만 봤어.\n너는 별을 실제로 본 적 있어?",
    "별자리 이름은 배웠는데 실제로 찾아본 적은 없어.\n선생님이 옛날엔 시골에 가면 쏟아질 듯이 보였다고 하셨어.\n너는 별을 보면 무슨 생각이 들어?"]},

{k:["하늘","구름","해","햇빛","노을","파란"],
 r:["하늘은 대부분 잿빛이야. 모래바람이 자주 불어서.\n일 년에 몇 번은 파랗게 갠 날이 있는데, 그날은 학교에서 방송을 해 줘.\n다들 작은 창으로 몰려가서 봐.\n너희 하늘은 오늘 무슨 색이야?",
    "해는 잘 안 봐. 낮에 밖에 못 나가니까.\n해 지고 나서 붉게 물드는 건 가끔 봐. 그건 예뻐.\n너는 노을을 마지막으로 언제 봤어?"]},

{k:["나무","숲","꽃","풀","잔디","정원","화분","초록"],
 r:["나무는 실내 정원에 몇 그루 있어. 만지면 진짜 나무야.\n밖에 있는 나무는 대부분 말라 버렸대.\n너희 학교에는 나무가 몇 그루쯤 있어?",
    "꽃은 실내 농장에서만 봐. 향기가 나는 게 신기해.\n길에 저절로 핀 꽃이 있다는 게 잘 상상이 안 돼.\n너는 길에서 꽃을 본 적 있어?"]},

{k:["눈","겨울","눈사람","썰매","춥"],
 r:["눈은 한 번도 못 봤어. 우리 동네에는 이제 안 내린대.\n영상으로는 봤는데, 진짜로 손에 닿으면 어떤 느낌인지 궁금해.\n눈이 오면 너는 뭘 해?",
    "겨울은 짧아. 십이월이랑 일월뿐이야.\n그때는 밖에 나갈 수 있어서 제일 좋은 계절이야.\n너희는 겨울에 뭘 하고 놀아?"]},

{k:["비","장마","우산","소나기"],
 r:["비는 와. 그런데 아주 세게 와. 한 번 오면 무섭게 쏟아지고 금방 그쳐.\n조용히 오래 내리는 비는 못 봤어.\n너희 비는 어떤 소리가 나?",
    "비 오는 날 우산을 쓴다는 게 재미있어 보여.\n여기선 비가 오면 아무도 밖에 안 나가.\n너는 비 맞아 본 적 있어?"]},

{k:["새","동물","강아지","고양이","벌레","나비","곤충","물고기"],
 r:["새는 가끔 봐. 창밖으로 지나가는 걸 보면 다들 창가로 몰려가.\n한 마리만 봐도 그날은 운이 좋은 날이야.\n너희 동네에는 새가 많아?",
    "어제 실내 정원에서 나비를 봤어. 진짜 나비였어.\n다들 사진 찍느라 난리였어.\n너는 오늘 어떤 동물을 봤어?"]},

{k:["바다","강","물","호수","계곡","파도"],
 r:["바다는 사진으로만 봤어. 우리 동네에서 너무 멀어서 못 가.\n소금 냄새가 난다는 게 어떤 건지 궁금해.\n너는 바다에 가 본 적 있어?",
    "물은 아주 귀해. 샤워도 정해진 시간만 해.\n수도꼭지를 계속 틀어 놓는 건 상상이 안 돼.\n너희는 물을 어떻게 쓰고 있어?"]},

{k:["밥","음식","먹","과일","아이스크림","간식","맛있","요리"],
 r:["아이스크림은 특별한 날에만 먹어. 냉동에 전기가 많이 들거든.\n생일에 하나씩 먹어.\n너는 아이스크림 무슨 맛 좋아해?",
    "과일이 제일 귀해. 사과 하나가 아주 비싸.\n작년에 처음으로 복숭아를 먹어 봤어. 정말 달았어.\n너는 무슨 과일을 제일 좋아해?",
    "우리 밥은 대부분 실내에서 키운 거야.\n논이 있는 사진을 봤는데, 그렇게 넓은 초록색은 처음 봤어.\n너희 동네에도 논이 있어?"]},

{k:["엄마","아빠","가족","형","누나","동생","할머니","할아버지","부모"],
 r:["할머니가 옛날 이야기를 자주 해 줘.\n어릴 때 밖에서 저녁까지 놀았다는데, 나는 그게 잘 상상이 안 돼.\n너는 저녁까지 밖에서 놀아 본 적 있어?",
    "엄마는 공기 정화 시설에서 일해. 아빠는 실내 농장에서 일하고.\n둘 다 사람들이 숨 쉬고 먹는 걸 만드는 일이야.\n너희 부모님은 무슨 일을 하셔?",
    "동생이 하나 있어. 다섯 살인데 아직 밖에 나가 본 적이 없어.\n밖이 뭐냐고 물어봐서 대답하기가 어려웠어.\n너라면 뭐라고 설명해 줄 것 같아?"]},

{k:["에어컨","전기","냉방","선풍기","발전"],
 r:["에어컨은 하루 종일 켜져 있어. 끄면 못 사니까.\n대신 전기를 아주 아껴 써. 불도 필요한 데만 켜.\n너희 교실 에어컨은 몇 도로 맞춰 놔?",
    "전기는 지금 거의 다 햇빛이랑 바람으로 만들어.\n좀 더 일찍 그렇게 했으면 좋았을 텐데, 하고 어른들이 말해.\n너희 학교 전기는 어디서 오는 거야?",
    "여기서는 전기를 함부로 못 써.\n집집마다 하루에 쓸 수 있는 양이 정해져 있어.\n너희는 전기를 쓸 때 신경 쓰는 편이야?"]},

{k:["왜","어쩌다","어떻게 됐","누구 때문","언제부터","원인"],
 r:["정확히 언제부터라고 말하긴 어려워.\n조금씩 더워졌고, 사람들이 알면서도 미뤘대.\n한 사람 잘못은 아니었대.\n너는 미루면 안 되는 일을 미뤄 본 적 있어?",
    "책에서 봤는데, 2020년대에 이미 다 알고 있었대.\n알고 있었는데 바꾸는 게 불편해서 조금씩 늦어졌다고 해.\n불편한 걸 미리 하는 건 왜 어려울까?",
    "우리 선생님은 이렇게 말씀하셔.\n\"아무도 나쁜 마음을 먹지 않았는데 이렇게 됐다\"고.\n그 말이 제일 무섭다고도 하셨어.\n너는 그 말이 무슨 뜻인 것 같아?"]},

{k:["미안","잘못","우리 때문","사과","책임","탓"],

var FALLBACK = [
 "음, 그건 나도 잘 모르겠어. 여기서는 그런 걸 배우지 않거든.\n대신 다른 걸 물어봐도 돼.\n너희 교실에서 제일 좋아하는 자리는 어디야?",
 "잘 못 알아들었어. 미안!\n다르게 물어봐 줄래?\n아니면 내가 하나 물어볼게. 너는 오늘 창밖을 몇 번이나 봤어?",
 "그건 여기선 없어진 거라 잘 몰라.\n대신 궁금한 게 있어. 너희는 비 오는 날 무슨 냄새가 나?",
 "그 말은 처음 들어 봐.\n2026년에는 그런 게 있구나.\n그거 말고 너희 학교 이야기를 더 들려줄래?"
];

var OPENERS = [
 "안녕! 너는 오늘 하루 어떻게 보냈어?",
 "2076년 여름은 얼마나 더워?",
 "학교 창밖에는 뭐가 보여?",
 "너희도 운동장에서 놀 수 있어?"
];
var MIDCHIPS = [
 "우리가 지금 뭘 하면 좋을까?",
 "에어컨을 조금만 켜면 달라질까?",
 "우리한테 하고 싶은 말 있어?",
 "네 교실은 어떻게 생겼어?"
];

/* ── 엔진 ─────────────────────────────────────────── */
var log=document.getElementById('log'), chips=document.getElementById('chips'),
    input=document.getElementById('input'), sendBtn=document.getElementById('send');
var used={}, turns=0;

function bubble(role, text){
  var w=document.createElement('div'); w.className='msg '+role;
  var who=document.createElement('div'); who.className='who';
  who.textContent = role==='me' ? '나' : '하온';
  if(role==='bot'){ who.style.fontSize='11px'; }
  var b=document.createElement('div'); b.className='bubble'; b.textContent=text;
  w.appendChild(who); w.appendChild(b); log.appendChild(w);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
  return b;
}

function pick(list, key){
  used[key] = used[key] || [];
  var free = [];
  for(var i=0;i<list.length;i++){ if(used[key].indexOf(i)<0) free.push(i); }
  if(free.length===0){ used[key]=[]; free=[]; for(var j=0;j<list.length;j++) free.push(j); }
  var idx = free[Math.floor(Math.random()*free.length)];
  used[key].push(idx);
  return list[idx];
}

function reply(text){
  var t = text.toLowerCase().replace(/\s+/g,' ');
  var best=null, bestScore=0;
  for(var i=0;i<BANK.length;i++){
    var score=0;
    for(var j=0;j<BANK[i].k.length;j++){
      if(t.indexOf(BANK[i].k[j])>=0) score += BANK[i].k[j].length;
    }
    score *= (BANK[i].w || 1);
    if(score>bestScore){ bestScore=score; best=i; }
  }
  if(best===null) return pick(FALLBACK,'fb');
  return pick(BANK[best].r,'b'+best);
}

function drawChips(){
  chips.innerHTML='';
  var pool = turns===0 ? OPENERS : MIDCHIPS;
  for(var i=0;i<pool.length;i++){
    (function(q){
      var c=document.createElement('button');
      c.className='chip'; c.type='button'; c.textContent=q;
      c.onclick=function(){ input.value=q; send(); };
      chips.appendChild(c);
    })(pool[i]);
  }
}

function send(){
  var text=input.value.trim();
  if(!text) return;
  input.value=''; input.style.height='50px';
  bubble('me', text);
  turns++;
  sendBtn.disabled=true;
  var holder=bubble('bot','● ● ●');
  var answer=reply(text);
  var wait = 500 + Math.min(answer.length*8, 900);
  setTimeout(function(){
    holder.textContent=answer;
    sendBtn.disabled=false;
    drawChips();
    window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
  }, wait);
}

function start(){
  log.innerHTML=''; used={}; turns=0; drawChips();
  bubble('bot','안녕! 나는 하온이야. 2076년에 살고 있어.\n오늘도 바깥은 51도라서 학교 밖으로는 못 나갔어.\n너희 교실은 어때?');
}

sendBtn.onclick=send;
input.onkeydown=function(e){
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
};
input.oninput=function(){
  input.style.height='50px';
  input.style.height=Math.min(input.scrollHeight,130)+'px';
};
document.getElementById('reset').onclick=start;
document.getElementById('print').onclick=function(){ window.print(); };
start();
</script>
